[package]
name = "novalink-agent"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "novalink_agent"
path = "src/lib.rs"

[[bin]]
name = "novalink-agent"
path = "src/main.rs"

[dependencies]
novalink-core = { path = "../core" }
novalink-net = { path = "../net" }
novalink-proto = { path = "../proto" }
anyhow.workspace = true
tokio.workspace = true
quinn.workspace = true
serde.workspace = true
clap.workspace = true
tempfile = { workspace = true, optional = true }
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
axum.workspace = true
subtle.workspace = true
hmac = "0.12"
sha2.workspace = true
rand_core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog.workspace = true
novalink-platform-macos = { path = "../platform-macos" }

[target.'cfg(windows)'.dependencies]
novalink-platform-windows = { path = "../platform-windows" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[features]
# Test helpers (`testutil`) and the in-memory platform.
fake = ["novalink-core/fake", "dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
