[package]
name = "novalink-client"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "novalink_client"
path = "src/lib.rs"

[dependencies]
novalink-agent = { path = "../agent" }
novalink-proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
novalink-agent = { path = "../agent", features = ["fake"] }
novalink-net = { path = "../net" }
tokio.workspace = true
axum.workspace = true
